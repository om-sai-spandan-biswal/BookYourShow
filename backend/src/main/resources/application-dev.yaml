server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/test
    username: postgres
    password: Postgresql@Om123
  jpa:
    hibernate:
      ddl-auto: update #create-drop
      dialect: {org.hibernate.dialect.PostgreSQLDialect}
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-lifetime: ${JWT_ACCESS_TOKEN_LIFETIME:600}
  refresh-token-lifetime: ${JWT_REFRESH_TOKEN_LIFETIME:86400}
  issuer: ${JWT_ISSUER}
